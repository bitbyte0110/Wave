apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-audit-worker
  namespace: wave
  labels:
    app: risk-audit-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: risk-audit-worker
  template:
    metadata:
      labels:
        app: risk-audit-worker
    spec:
      containers:
        - name: risk-audit-worker
          image: wave/risk-audit-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          envFrom:
            - secretRef:
                name: gemini-secret
            - secretRef:
                name: rabbitmq-secret
          env:
            - name: SPRING_RABBITMQ_HOST
              value: "rabbitmq"
            - name: SPRING_RABBITMQ_PORT
              value: "5672"
            - name: SWAP_ENGINE_BASE_URL
              value: "http://swap-engine:8084"
