apiVersion: apps/v1
kind: Deployment
metadata:
  name: swap-engine
  namespace: wave
  labels:
    app: swap-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: swap-engine
  template:
    metadata:
      labels:
        app: swap-engine
    spec:
      containers:
        - name: swap-engine
          image: wave/swap-engine:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
          envFrom:
            - secretRef:
                name: mysql-secret
            - secretRef:
                name: rabbitmq-secret
            - secretRef:
                name: internal-api-secret
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/waveterminal?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
            - name: SPRING_RABBITMQ_HOST
              value: "rabbitmq"
            - name: SPRING_RABBITMQ_PORT
              value: "5672"
            - name: SPRING_REDIS_HOST
              value: "redis"
            - name: SPRING_REDIS_PORT
              value: "6379"
---
apiVersion: v1
kind: Service
metadata:
  name: swap-engine
  namespace: wave
spec:
  selector:
    app: swap-engine
  ports:
    - port: 8084
      targetPort: 8084
