apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: wave
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: wave/frontend:v2
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: INTERNAL_GATEWAY_URL
              value: "http://gateway:8080"
            - name: NEXT_PUBLIC_GATEWAY_URL
              value: ""
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: wave
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
